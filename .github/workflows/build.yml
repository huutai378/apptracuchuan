name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Xóa sạch SDK/NDK rác có sẵn của GitHub để tránh xung đột
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/android

      - name: Install system dependencies (with 32-bit support & build tools)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
              python3-pip \
              build-essential \
              git \
              python3-dev \
              libffi-dev \
              libssl-dev \
              zlib1g-dev \
              unzip \
              libltdl-dev \
              openjdk-11-jdk \
              libncurses5:i386 \
              libstdc++6:i386 \
              zlib1g:i386 \
              autoconf \
              libtool \
              pkg-config

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install Cython==0.29.36 buildozer python-for-android

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android
          path: bin/*.apk
